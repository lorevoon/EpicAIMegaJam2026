[ConsoleVariables]
; Cache range EV -4..16 covers the bright studio and wildfire/sky lighting.
r.EyeAdaptation.CachedLightingPreExposure=8
; Global distance field (Lumen): avoid the 180 ms GlobalDistanceFieldUpdate hitches during playback.
; Don't throw the cached clipmaps away and rebuild them while mesh SDFs are still streaming in.
r.AOGlobalDistanceField.RecacheClipmapsWithPendingStreaming=0
; Leave small props (under 1 m radius: fences, wheat, small rocks) out of the global field; Lumen still traces their own SDFs up close.
r.AOGlobalDistanceField.MinMeshSDFRadius=100
; Cheaper, faster updates when the camera moves quickly.
r.AOGlobalDistanceField.FastCameraMode=1
; With Lumen on, this is the global distance field's resolution (default 252). Update cost grows with its cube:
; 160 is about a quarter of the default's cost, with little visible change to Lumen's large-scale lighting.
r.LumenScene.GlobalSDF.Resolution=160
; Soft shadows from the studio's six big rect lights were the largest GPU cost (VirtualShadowMapProjectionMaskBits,
; ~4.4 ms/frame). Their penumbrae are traced with RayCount x SamplesPerRay shadow-map samples per pixel: 4 x 4 instead
; of the default 7 x 8 is about a third of the work; TSR smooths the slightly noisier soft edges.
r.Shadow.Virtual.SMRT.RayCountLocal=4
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=4
; NVIDIA DLSS (Plugins/DLSS, Streamline*). On RTX cards DLSS Super Resolution replaces TSR as the upscaler. The
; screen percentage picks its mode (100 = DLAA, ~67 = Quality, 58 = Balanced, 50 = Performance); the game sets it at
; startup - DLSS Quality where DLSS runs, native elsewhere (ApplyRenderResolution in DCMultiCamDirector.cpp).
r.NGX.DLSS.Enable=1
; DLSS Frame Generation, auto mode: generates in-between frames only where the GPU supports it and it helps.
r.Streamline.DLSSG.Enable=2
; Reflex low latency (required alongside frame generation).
t.Streamline.Reflex.Enable=1

